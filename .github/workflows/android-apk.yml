name: Build Areesha Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check required project files
        run: |
          test -f package.json || {
            echo "::error::package.json is missing"
            exit 1
          }

          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.build) {
              console.error('Missing npm build script');
              process.exit(1);
            }
          "

          echo "Project files checked."

      - name: Build production web application
        run: npm run build

      - name: Check Capacitor configuration
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration is missing."
            exit 1
          fi

          npx cap --version

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android project
        run: |
          test -f android/gradlew || {
            echo "::error::Android Gradle wrapper is missing."
            exit 1
          }

          chmod +x android/gradlew

          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts || {
            echo "::error::Android app Gradle file is missing."
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file was not generated."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK generated successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Areesha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Areesha APK build succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "Version: ${VERSION_NAME}" >> "$GITHUB_STEP_SUMMARY"
            echo "Download Areesha-debug-apk from the Artifacts section." >> "$GITHUB_STEP_SUMMARY"
            echo "This is a debug APK for testing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Areesha APK build failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the failed workflow step and inspect its logs." >> "$GITHUB_STEP_SUMMARY"
          fi