name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production web app
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on GitHub runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            ls -R android/app/build/outputs || true
            exit 1
          fi
          ls -lh "$APK"
          # An APK is a ZIP archive containing AndroidManifest.xml and the bundled web assets
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "assets/public/index.html"
          echo "APK verified: manifest and bundled web app present."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Areesha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Build succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "Download **Areesha-debug-apk** from the Artifacts section below. Version ${VERSION_NAME} (code ${VERSION_CODE}). This is a DEBUG build for testing, not a production-signed release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the failed step above to see the error log." >> "$GITHUB_STEP_SUMMARY"
          fi