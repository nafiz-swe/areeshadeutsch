name: Release signed APK

# Run manually (Actions → Release signed APK → Run workflow) or push a tag like v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer, must increase every release)'
        required: true
        default: '1'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are configured
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v. See README → Signed release APK."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (kept outside the repository, never printed)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/areesha-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/areesha-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Signed APK not found at $APK (an app-release-unsigned.apk means signing was not applied)"; ls -R android/app/build/outputs/apk || true; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$APK" | head -5
          cp "$APK" "Areesha-${VERSION_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Areesha-release-apk
          path: Areesha-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Areesha-*.apk
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/areesha-release.jks"
